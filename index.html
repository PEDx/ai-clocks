<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mechanical Clock Gallery</title>
  <style>
    :root {
      --bg: #FAF9F7;
      --surface: #ffffff;
      --text: #1A1612;
      --text-secondary: #6B6560;
      --muted: #9C9590;
      --line: #E8E4DF;
      --accent: #D97757;
      --accent-soft: rgba(217, 119, 87, 0.08);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      color: var(--text);
      font-family: -apple-system, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
    }

    .page {
      width: min(1420px, calc(100% - 48px));
      margin: 0 auto;
      padding: 48px 0 180px;
    }

    .directory-toggle {
      display: none;
      position: fixed;
      top: 50%;
      left: 12px;
      z-index: 31;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--text-secondary);
      background: var(--surface);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
      transform: translateY(-50%);
      cursor: pointer;
    }

    .directory-toggle:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .directory-backdrop {
      position: fixed;
      inset: 0;
      z-index: 29;
      background: rgba(26, 22, 18, 0.24);
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease;
    }

    .model-directory {
      position: fixed;
      top: 50%;
      left: max(16px, calc((100vw - 1420px) / 2 - 224px));
      z-index: 30;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      width: 196px;
      height: min(72vh, 680px);
      max-height: calc(100vh - 32px);
      padding: 16px 10px 12px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
      transform: translateY(-50%);
      overflow: hidden;
    }

    .directory-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      padding: 0 8px 10px;
    }

    .directory-title {
      margin: 0;
      font-size: 13px;
      font-weight: 650;
      letter-spacing: 0.01em;
    }

    .directory-count {
      color: var(--muted);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    .directory-close {
      display: none;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      margin: -5px -2px -5px 0;
      border: 0;
      border-radius: 8px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
    }

    .directory-close:hover {
      color: var(--text);
      background: rgba(0, 0, 0, 0.05);
    }

    .directory-list {
      display: grid;
      gap: 2px;
      min-height: 0;
      margin: 0;
      padding: 0;
      overflow-y: auto;
      list-style: none;
      scrollbar-width: thin;
      scrollbar-color: var(--line) transparent;
    }

    .directory-link {
      display: block;
      overflow: hidden;
      padding: 8px;
      border-radius: 8px;
      color: var(--text-secondary);
      font-size: 12px;
      line-height: 1.25;
      text-decoration: none;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: color 150ms ease, background 150ms ease;
    }

    .directory-link:hover {
      color: var(--text);
      background: var(--accent-soft);
    }

    .directory-link.is-active {
      color: var(--accent);
      font-weight: 600;
      background: var(--accent-soft);
    }

    .hero {
      margin-bottom: 32px;
      padding: 28px 32px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .timebar {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
    }

    .time-label {
      margin: 0 0 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .time-value {
      margin: 0;
      font-size: clamp(28px, 4vw, 40px);
      font-weight: 600;
      line-height: 1;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }

    .timezone {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
      text-align: right;
      white-space: nowrap;
    }

    .time-meta {
      display: grid;
      justify-items: end;
      gap: 10px;
    }

    .repo-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 500;
      line-height: 1;
      text-decoration: none;
      background: var(--surface);
      transition: border-color 150ms ease, color 150ms ease;
    }

    .repo-link:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .prompt-box {
      position: fixed;
      left: 50%;
      bottom: 24px;
      z-index: 20;
      display: grid;
      gap: 12px;
      width: min(720px, calc(100vw - 48px));
      padding: 16px 20px 14px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--surface);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
      transform: translateX(-50%);
    }

    .prompt-main {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      min-height: 40px;
    }

    .prompt-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      flex: 0 0 28px;
      border-radius: 8px;
      color: var(--accent);
      background: var(--accent-soft);
    }

    .prompt-text {
      flex: 1 1 auto;
      margin: 3px 0 0;
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
    }

    .prompt-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .prompt-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tool-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 999px;
      color: var(--muted);
      background: transparent;
      transition: background 150ms ease, color 150ms ease;
    }

    .tool-button:hover {
      background: rgba(0, 0, 0, 0.04);
      color: var(--text-secondary);
    }

    .prompt-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    .model-select {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 32px;
      padding: 0 12px;
      border-radius: 999px;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
      background: transparent;
      white-space: nowrap;
      transition: background 150ms ease;
    }

    .model-select:hover {
      background: rgba(0, 0, 0, 0.04);
    }

    .send-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 999px;
      color: #fff;
      background: var(--text);
      transition: opacity 150ms ease;
    }

    .send-button:hover {
      opacity: 0.85;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }

    .card {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      transition: box-shadow 200ms ease;
    }

    .card:hover {
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
    }

    .card-title {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.3;
      letter-spacing: -0.01em;
    }

    .card-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex: 0 0 auto;
      height: 32px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 500;
      text-decoration: none;
      background: var(--surface);
      transition: border-color 150ms ease, color 150ms ease;
    }

    .card-link:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .card-link-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .stats-panel {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      padding: 14px 20px 16px;
      border-bottom: 1px solid var(--line);
      background:
        linear-gradient(180deg, rgba(250, 249, 247, 0.7), rgba(255, 255, 255, 0.95));
    }

    .stat-card {
      min-width: 0;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
    }

    .stat-card.is-primary {
      border-color: rgba(217, 119, 87, 0.22);
      background: var(--accent-soft);
    }

    .stat-value {
      display: block;
      color: var(--text);
      font-size: 18px;
      font-weight: 650;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .stat-label {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
      line-height: 1.2;
      white-space: nowrap;
    }

    .stat-card.is-compact {
      padding: 8px 10px;
    }

    .stat-card.is-compact .stat-value {
      font-size: 14px;
    }

    .preview {
      position: relative;
      aspect-ratio: 1 / 1;
      padding: 12px;
    }

    .preview-frame {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 10px;
      background: #fff;
      border: 1px solid var(--line);
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }

    @media (max-width: 720px) {
      .directory-toggle {
        display: inline-flex;
      }

      .directory-backdrop {
        display: block;
      }

      .model-directory {
        top: 0;
        bottom: 0;
        left: 0;
        width: min(82vw, 320px);
        height: 100%;
        max-height: none;
        padding: 22px 14px 18px;
        border-width: 0 1px 0 0;
        border-radius: 0 18px 18px 0;
        box-shadow: 8px 0 28px rgba(0, 0, 0, 0.12);
        transform: translateX(-102%);
        transition: transform 220ms ease;
      }

      .directory-heading {
        padding: 0 8px 14px;
      }

      .directory-close {
        display: inline-flex;
      }

      body.directory-open .model-directory {
        transform: translateX(0);
      }

      body.directory-open .directory-backdrop {
        opacity: 1;
        pointer-events: auto;
      }

      body.directory-open {
        overflow: hidden;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .page {
        width: min(100% - 32px, 1200px);
        padding: 24px 0 180px;
      }

      .hero {
        padding: 20px;
      }

      .timebar {
        align-items: flex-start;
        flex-direction: column;
      }

      .timezone {
        text-align: left;
        white-space: normal;
      }

      .time-meta {
        justify-items: start;
      }

      .card-head {
        flex-direction: column;
        align-items: flex-start;
      }

      .stats-panel {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .prompt-toolbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .prompt-meta {
        margin-left: 0;
      }

      .prompt-box {
        bottom: 16px;
        width: min(calc(100vw - 32px), 720px);
      }
    }
  </style>
</head>

        path: "./models/qwen-3.6-35b/index.html",
        stats: { lines: 255, codeLines: 212, blankLines: 26, commentLines: 17, functions: 4, scripts: 1, styles: 1, bytes: 7047 }
      },
      {
        name: "Qwen 3.6 27B",
        path: "./models/qwen-3.6-27b/index.html",
        stats: { lines: 402, codeLines: 332, blankLines: 48, commentLines: 22, functions: 14, scripts: 1, styles: 1, bytes: 11348 }
      },
      {
        name: "MiniMax 2.7",
        path: "./models/minimax-2.7/index.html",
        stats: { lines: 247, codeLines: 190, blankLines: 36, commentLines: 21, functions: 4, scripts: 1, styles: 1, bytes: 7647 }
      },
      {
        name: "Qwen 3.5 122B",
        path: "./models/qwen-122b/index.html",
        stats: { lines: 217, codeLines: 169, blankLines: 29, commentLines: 19, functions: 7, scripts: 1, styles: 1, bytes: 6983 }
      },
      {
        name: "Qwen 3.5 27B",
        path: "./models/qwen-27b/index.html",
        stats: { lines: 141, codeLines: 106, blankLines: 22, commentLines: 13, functions: 2, scripts: 1, styles: 1, bytes: 4579 }
      }
    ]

    const grid = document.getElementById("grid")
    const timeValue = document.getElementById("timeValue")
    const timezoneValue = document.getElementById("timezoneValue")

    function updateTime() {
      const now = new Date()
      const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone || "Unknown"
      const timeText = new Intl.DateTimeFormat("zh-CN", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      }).format(now)

      timeValue.textContent = timeText
      timezoneValue.textContent = `Timezone: ${timezone}`
    }
    updateTime()
    window.setInterval(updateTime, 1000)

    function formatBytes(bytes) {
      if (!Number.isFinite(bytes)) return "-"
      if (bytes < 1024) return `${bytes} B`
      return `${(bytes / 1024).toFixed(1)} KB`
    }

    models.forEach((model) => {
      const card = document.createElement("article")
      card.className = "card"
      card.id = `model-${models.indexOf(model)}`
      const stats = model.stats || {}

      card.innerHTML = `
        <div class="card-head">
          <div>
            <h2 class="card-title">${model.name}</h2>
          </div>
          <a class="card-link" href="${model.path}" target="_blank" rel="noreferrer">
            <span>Open separately</span>
            <span class="card-link-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M7 17L17 7"></path>
                <path d="M9 7h8v8"></path>
              </svg>
            </span>
          </a>
        </div>
        <div class="stats-panel" aria-label="${model.name} code statistics">
          <div class="stat-card is-primary">
            <span class="stat-value">${stats.lines ?? "-"}</span>
            <span class="stat-label">Lines</span>
          </div>
          <div class="stat-card is-primary">
            <span class="stat-value">${stats.functions ?? "-"}</span>
            <span class="stat-label">Functions</span>
          </div>
          <div class="stat-card is-primary">
            <span class="stat-value">${stats.commentLines ?? "-"}</span>
            <span class="stat-label">Comments</span>
          </div>
          <div class="stat-card is-primary">
            <span class="stat-value">${formatBytes(stats.bytes)}</span>
            <span class="stat-label">Size</span>
          </div>
          <div class="stat-card is-compact">
            <span class="stat-value">${stats.codeLines ?? "-"}</span>
            <span class="stat-label">Code lines</span>
          </div>
          <div class="stat-card is-compact">
            <span class="stat-value">${stats.blankLines ?? "-"}</span>
            <span class="stat-label">Blank lines</span>
          </div>
        </div>
        <div class="preview">
          <div class="preview-frame">
            <iframe
              src="${model.path}"
              title="${model.name} mechanical clock preview"
              loading="lazy"
              referrerpolicy="no-referrer"
            ></iframe>
          </div>
        </div>
      `

      grid.appendChild(card)
    });

    const directoryList = document.getElementById("modelDirectoryList")
    const directoryCount = document.getElementById("directoryCount")
    const directoryToggle = document.getElementById("directoryToggle")
    const directoryClose = document.getElementById("directoryClose")
    const directoryBackdrop = document.getElementById("directoryBackdrop")

    directoryCount.textContent = `${models.length} 个模型`
    models.forEach((model, index) => {
      const item = document.createElement("li")
      const link = document.createElement("a")
      link.className = "directory-link"
      link.href = `#model-${index}`
      link.textContent = model.name
      link.dataset.target = `model-${index}`
      item.appendChild(link)
      directoryList.appendChild(item)
    })

    function setDirectoryOpen(isOpen) {
      document.body.classList.toggle("directory-open", isOpen)
      directoryToggle.setAttribute("aria-expanded", String(isOpen))
    }

    directoryToggle.addEventListener("click", () => setDirectoryOpen(true))
    directoryClose.addEventListener("click", () => setDirectoryOpen(false))
    directoryBackdrop.addEventListener("click", () => setDirectoryOpen(false))
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") setDirectoryOpen(false)
    })
    directoryList.addEventListener("click", (event) => {
      const link = event.target.closest(".directory-link")
      if (!link) return
      setDirectoryOpen(false)
      directoryList.querySelectorAll(".directory-link").forEach((item) => item.classList.remove("is-active"))
      link.classList.add("is-active")
    })

    const directoryLinks = [...directoryList.querySelectorAll(".directory-link")]
    const cardObserver = new IntersectionObserver((entries) => {
      const visible = entries
        .filter((entry) => entry.isIntersecting)
        .sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0]
      if (!visible) return
      directoryLinks.forEach((link) => link.classList.toggle("is-active", link.dataset.target === visible.target.id))
    }, { rootMargin: "-18% 0px -62% 0px", threshold: [0, 0.25, 0.6, 1] })

    document.querySelectorAll(".card").forEach((card) => cardObserver.observe(card))
    directoryLinks[0]?.classList.add("is-active")
  </script>
</body>

</html>
