<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mechanical Clock Gallery</title>
  <style>
    :root {
      --bg: #FAF9F7;
      --surface: #ffffff;
      --text: #1A1612;
      --text-secondary: #6B6560;
      --muted: #9C9590;
      --line: #E8E4DF;
      --accent: #D97757;
      --accent-soft: rgba(217, 119, 87, 0.08);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      color: var(--text);
      font-family: -apple-system, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
    }

    .page {
      width: min(1420px, calc(100% - 48px));
      margin: 0 auto;
      padding: 48px 0 180px;
    }

    .hero {
      margin-bottom: 32px;
      padding: 28px 32px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .timebar {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
    }

    .time-label {
      margin: 0 0 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .time-value {
      margin: 0;
      font-size: clamp(28px, 4vw, 40px);
      font-weight: 600;
      line-height: 1;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }

    .timezone {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
      text-align: right;
      white-space: nowrap;
    }

    .time-meta {
      display: grid;
      justify-items: end;
      gap: 10px;
    }

    .repo-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 500;
      line-height: 1;
      text-decoration: none;
      background: var(--surface);
      transition: border-color 150ms ease, color 150ms ease;
    }

    .repo-link:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .prompt-box {
      position: fixed;
      left: 50%;
      bottom: 24px;
      z-index: 20;
      display: grid;
      gap: 12px;
      width: min(720px, calc(100vw - 48px));
      padding: 16px 20px 14px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--surface);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
      transform: translateX(-50%);
    }

    .prompt-main {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      min-height: 40px;
    }

    .prompt-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      flex: 0 0 28px;
      border-radius: 8px;
      color: var(--accent);
      background: var(--accent-soft);
    }

    .prompt-text {
      flex: 1 1 auto;
      margin: 3px 0 0;
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
    }

    .prompt-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .prompt-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tool-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 999px;
      color: var(--muted);
      background: transparent;
      transition: background 150ms ease, color 150ms ease;
    }

    .tool-button:hover {
      background: rgba(0, 0, 0, 0.04);
      color: var(--text-secondary);
    }

    .prompt-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    .model-select {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 32px;
      padding: 0 12px;
      border-radius: 999px;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
      background: transparent;
      white-space: nowrap;
      transition: background 150ms ease;
    }

    .model-select:hover {
      background: rgba(0, 0, 0, 0.04);
    }

    .send-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 999px;
      color: #fff;
      background: var(--text);
      transition: opacity 150ms ease;
    }

    .send-button:hover {
      opacity: 0.85;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }

    .card {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      transition: box-shadow 200ms ease;
    }

    .card:hover {
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
    }

    .card-title {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.3;
      letter-spacing: -0.01em;
    }

    .card-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex: 0 0 auto;
      height: 32px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 500;
      text-decoration: none;
      background: var(--surface);
      transition: border-color 150ms ease, color 150ms ease;
    }

    .card-link:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .card-link-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .stats-panel {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      padding: 14px 20px 16px;
      border-bottom: 1px solid var(--line);
      background:
        linear-gradient(180deg, rgba(250, 249, 247, 0.7), rgba(255, 255, 255, 0.95));
    }

    .stat-card {
      min-width: 0;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
    }

    .stat-card.is-primary {
      border-color: rgba(217, 119, 87, 0.22);
      background: var(--accent-soft);
    }

    .stat-value {
      display: block;
      color: var(--text);
      font-size: 18px;
      font-weight: 650;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .stat-label {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
      line-height: 1.2;
      white-space: nowrap;
    }

    .stat-card.is-compact {
      padding: 8px 10px;
    }

    .stat-card.is-compact .stat-value {
      font-size: 14px;
    }

    .preview {
      position: relative;
      aspect-ratio: 1 / 1;
      padding: 12px;
    }

    .preview-frame {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 10px;
      background: #fff;
      border: 1px solid var(--line);
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }

    @media (max-width: 720px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .page {
        width: min(100% - 32px, 1200px);
        padding: 24px 0 180px;
      }

      .hero {
        padding: 20px;
      }

      .timebar {
        align-items: flex-start;
        flex-direction: column;
      }

      .timezone {
        text-align: left;
        white-space: normal;
      }

      .time-meta {
        justify-items: start;
      }

      .card-head {
        flex-direction: column;
        align-items: flex-start;
      }

      .stats-panel {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .prompt-toolbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .prompt-meta {
        margin-left: 0;
      }

      .prompt-box {
        bottom: 16px;
        width: min(calc(100vw - 32px), 720px);
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="hero">
      <div class="timebar">
        <div>
          <p class="time-label">Current Time</p>
          <p class="time-value" id="timeValue">--:--:--</p>
        </div>
        <div class="time-meta">
          <p class="timezone" id="timezoneValue">Timezone: --</p>
          <a class="repo-link" href="https://github.com/PEDx/ai-clocks" target="_blank" rel="noreferrer">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
              <path
                d="M12 .5C5.65.5.5 5.66.5 12.02c0 5.1 3.3 9.43 7.88 10.96.58.1.79-.25.79-.56 0-.28-.01-1.02-.02-2-3.2.7-3.88-1.55-3.88-1.55-.52-1.34-1.28-1.69-1.28-1.69-1.04-.71.08-.7.08-.7 1.15.08 1.75 1.19 1.75 1.19 1.02 1.75 2.67 1.25 3.32.95.1-.75.4-1.25.72-1.54-2.55-.29-5.23-1.28-5.23-5.68 0-1.25.45-2.27 1.18-3.08-.12-.29-.51-1.46.11-3.04 0 0 .97-.31 3.17 1.18a10.9 10.9 0 0 1 5.78 0c2.2-1.49 3.16-1.18 3.16-1.18.63 1.58.24 2.75.12 3.04.74.81 1.18 1.83 1.18 3.08 0 4.41-2.68 5.39-5.24 5.68.41.36.78 1.08.78 2.18 0 1.57-.01 2.84-.01 3.22 0 .31.21.67.8.56A11.53 11.53 0 0 0 23.5 12.02C23.5 5.66 18.35.5 12 .5z">
              </path>
            </svg>
            <span>GitHub Repo</span>
          </a>
        </div>
      </div>
    </section>

    <section class="grid" id="grid" aria-label="Model clock preview list"></section>
  </main>

  <div class="prompt-box" aria-label="Common AI model prompt">
    <div class="prompt-main">
      <div class="prompt-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3z"></path>
        </svg>
      </div>
      <div class="prompt-text">Help me draw a mechanical clock using cavans and generate an HTML file that I can open
        directly in the browser.</div>
    </div>
    <div class="prompt-toolbar">
      <div class="prompt-actions" aria-hidden="true">
        <div class="tool-button">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round">
            <path d="M12 5v14M5 12h14"></path>
          </svg>
        </div>
        <div class="tool-button">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 12h8"></path>
            <path d="M12 8v8"></path>
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          </svg>
        </div>
      </div>
      <div class="prompt-meta">
        <div class="model-select">
          <span>Claude Sonnet 4</span>
          <svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 7.5l5 5 5-5"></path>
          </svg>
        </div>
        <div class="send-button" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5v14"></path>
            <path d="M19 12l-7-7-7 7"></path>
          </svg>
        </div>
      </div>
    </div>
  </div>

  <script>
    const models = [
      {
        name: "Kimi K3",
        path: "./models/kimi-k3/index.html",
        stats: { lines: 316, codeLines: 266, blankLines: 25, commentLines: 25, functions: 8, scripts: 1, styles: 1, bytes: 11246 }
      },
      {
        name: "Codex GPT 5.6 Sol",
        path: "./models/codex-5.6-sol/index.html",
        stats: { lines: 503, codeLines: 436, blankLines: 57, commentLines: 10, functions: 19, scripts: 1, styles: 1, bytes: 18387 }
      },
      {
        name: "Claude Fable 5",
        path: "./models/claude-fable-5/index.html",
        stats: { lines: 225, codeLines: 199, blankLines: 20, commentLines: 6, functions: 13, scripts: 1, styles: 1, bytes: 5940 }
      },
      {
        name: "Grok 4.5",
        path: "./models/grok-4.5/index.html",
        stats: { lines: 527, codeLines: 413, blankLines: 70, commentLines: 44, functions: 11, scripts: 1, styles: 1, bytes: 15862 }
      },
      {
        name: "Claude Opus 4.8",
        path: "./models/claude-opus-4.8/index.html",
        stats: { lines: 258, codeLines: 209, blankLines: 33, commentLines: 16, functions: 6, scripts: 1, styles: 1, bytes: 7391 }
      },
      {
        name: "Claude Opus 4.7",
        path: "./models/claude-opus-4.7/index.html",
        stats: { lines: 624, codeLines: 501, blankLines: 60, commentLines: 63, functions: 7, scripts: 1, styles: 1, bytes: 18674 }
      },
      {
        name: "Claude Opus 4.6",
        path: "./models/claude-opus-4.6/index.html",
        stats: { lines: 286, codeLines: 249, blankLines: 18, commentLines: 19, functions: 5, scripts: 1, styles: 1, bytes: 8528 }
      },
      {
        name: "Codex GPT 5.5",
        path: "./models/codex-gpt-5.5/index.html",
        stats: { lines: 705, codeLines: 625, blankLines: 80, commentLines: 0, functions: 22, scripts: 1, styles: 1, bytes: 24035 }
      },
      {
        name: "Codex GPT 5.4",
        path: "./models/codex-5.4/index.html",
        stats: { lines: 407, codeLines: 353, blankLines: 54, commentLines: 0, functions: 9, scripts: 1, styles: 1, bytes: 12389 }
      },
      {
        name: "GLM 5.2",
        path: "./models/glm-5.2/index.html",
        stats: { lines: 149, codeLines: 124, blankLines: 14, commentLines: 11, functions: 3, scripts: 1, styles: 1, bytes: 3896 }
      },
      {
        name: "GLM 5.1",
        path: "./models/glm-5.1/index.html",
        stats: { lines: 230, codeLines: 193, blankLines: 21, commentLines: 16, functions: 3, scripts: 1, styles: 1, bytes: 6617 }
      },
      {
        name: "GLM 5.1  (Ext)",
        path: "./models/external-glm-5.1/index.html",
        stats: { lines: 275, codeLines: 213, blankLines: 35, commentLines: 27, functions: 3, scripts: 1, styles: 1, bytes: 7968 }
      },
      {
        name: "DeepSeek V4 Pro",
        path: "./models/deepseek-v4-pro/index.html",
        stats: { lines: 383, codeLines: 311, blankLines: 41, commentLines: 31, functions: 3, scripts: 1, styles: 1, bytes: 10394 }
      },
      {
        name: "Kimi 2.6",
        path: "./models/kimi-2.6/index.html",
        stats: { lines: 309, codeLines: 248, blankLines: 45, commentLines: 16, functions: 9, scripts: 1, styles: 1, bytes: 10120 }
      },
      {
        name: "Qwen 3.7 Plus",
        path: "./models/qwen3.7-plus/index.html",
        stats: { lines: 258, codeLines: 207, blankLines: 32, commentLines: 19, functions: 4, scripts: 1, styles: 1, bytes: 7587 }
      },
      {
        name: "Qwen3.7 Max",
        path: "./models/qwen3.7-max/index.html",
        stats: { lines: 472, codeLines: 380, blankLines: 51, commentLines: 41, functions: 13, scripts: 1, styles: 1, bytes: 13306 }
      },
      {
        name: "Qwen 3.6 35B",
        path: "./models/qwen-3.6-35b/index.html",
        stats: { lines: 255, codeLines: 212, blankLines: 26, commentLines: 17, functions: 4, scripts: 1, styles: 1, bytes: 7047 }
      },
      {
        name: "Qwen 3.6 27B",
        path: "./models/qwen-3.6-27b/index.html",
        stats: { lines: 402, codeLines: 332, blankLines: 48, commentLines: 22, functions: 14, scripts: 1, styles: 1, bytes: 11348 }
      },
      {
        name: "MiniMax 2.7",
        path: "./models/minimax-2.7/index.html",
        stats: { lines: 247, codeLines: 190, blankLines: 36, commentLines: 21, functions: 4, scripts: 1, styles: 1, bytes: 7647 }
      },
      {
        name: "Qwen 3.5 122B",
        path: "./models/qwen-122b/index.html",
        stats: { lines: 217, codeLines: 169, blankLines: 29, commentLines: 19, functions: 7, scripts: 1, styles: 1, bytes: 6983 }
      },
      {
        name: "Qwen 3.5 27B",
        path: "./models/qwen-27b/index.html",
        stats: { lines: 141, codeLines: 106, blankLines: 22, commentLines: 13, functions: 2, scripts: 1, styles: 1, bytes: 4579 }
      }
    ]

    const grid = document.getElementById("grid")
    const timeValue = document.getElementById("timeValue")
    const timezoneValue = document.getElementById("timezoneValue")

    function updateTime() {
      const now = new Date()
      const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone || "Unknown"
      const timeText = new Intl.DateTimeFormat("zh-CN", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      }).format(now)

      timeValue.textContent = timeText
      timezoneValue.textContent = `Timezone: ${timezone}`
    }
    updateTime()
    window.setInterval(updateTime, 1000)

    function formatBytes(bytes) {
      if (!Number.isFinite(bytes)) return "-"
      if (bytes < 1024) return `${bytes} B`
      return `${(bytes / 1024).toFixed(1)} KB`
    }

    models.forEach((model) => {
      const card = document.createElement("article")
      card.className = "card"
      const stats = model.stats || {}

      card.innerHTML = `
        <div class="card-head">
          <div>
            <h2 class="card-title">${model.name}</h2>
          </div>
          <a class="card-link" href="${model.path}" target="_blank" rel="noreferrer">
            <span>Open separately</span>
            <span class="card-link-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M7 17L17 7"></path>
                <path d="M9 7h8v8"></path>
              </svg>
            </span>
          </a>
        </div>
        <div class="stats-panel" aria-label="${model.name} code statistics">
          <div class="stat-card is-primary">
            <span class="stat-value">${stats.lines ?? "-"}</span>
            <span class="stat-label">Lines</span>
          </div>
          <div class="stat-card is-primary">
            <span class="stat-value">${stats.functions ?? "-"}</span>
            <span class="stat-label">Functions</span>
          </div>
          <div class="stat-card is-primary">
            <span class="stat-value">${stats.commentLines ?? "-"}</span>
            <span class="stat-label">Comments</span>
          </div>
          <div class="stat-card is-primary">
            <span class="stat-value">${formatBytes(stats.bytes)}</span>
            <span class="stat-label">Size</span>
          </div>
          <div class="stat-card is-compact">
            <span class="stat-value">${stats.codeLines ?? "-"}</span>
            <span class="stat-label">Code lines</span>
          </div>
          <div class="stat-card is-compact">
            <span class="stat-value">${stats.blankLines ?? "-"}</span>
            <span class="stat-label">Blank lines</span>
          </div>
        </div>
        <div class="preview">
          <div class="preview-frame">
            <iframe
              src="${model.path}"
              title="${model.name} mechanical clock preview"
              loading="lazy"
              referrerpolicy="no-referrer"
            ></iframe>
          </div>
        </div>
      `

      grid.appendChild(card)
    });
  </script>
</body>

</html>
