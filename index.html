<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mechanical Clock Gallery</title>
  <style>
    :root {
      --bg: #f5f4f0;
      --surface: #fff;
      --text: #262923;
      --text-secondary: #6b7066;
      --muted: #797d74;
      --line: #e3e5dd;
      --accent: #586448;
      --accent-soft: #eef1e8;
      --radius: 20px;
    }

    * { box-sizing: border-box; }
    html { scroll-padding-top: 24px; }
    body { margin: 0; color: var(--text); background: var(--bg); font-family: -apple-system, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif; -webkit-font-smoothing: antialiased; }
    button, a, summary { -webkit-tap-highlight-color: transparent; }
    button { font: inherit; cursor: pointer; }
    button, a, summary { touch-action: manipulation; }
    :focus-visible { outline: 3px solid #8a9b70; outline-offset: 4px; }
    button svg, a svg { flex-shrink: 0; }
    .page { max-width: 1440px; margin: 0 auto; padding: 48px 32px 64px 256px; }

    .hero { margin-bottom: 24px; }
    .timebar { display: flex; align-items: center; justify-content: space-between; gap: 28px; }
    .hero h1 { margin: 0; font-size: clamp(28px, 3vw, 40px); line-height: 1.2; font-weight: 650; letter-spacing: -.045em; }
    .hero-description { margin: 12px 0 0; color: var(--text-secondary); font-size: 13px; line-height: 1.7; }
    .time-meta { display: grid; justify-items: end; gap: 7px; flex-shrink: 0; }
    .time-value { margin: 0; font-size: 28px; font-weight: 500; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
    .timezone { margin: 0; color: var(--muted); font-size: 11px; }
    .repo-link { display: inline-flex; align-items: center; gap: 7px; margin-top: 8px; color: var(--text-secondary); text-decoration: none; font-size: 12px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
    .repo-link:hover { color: var(--text); border-color: #b8bfac; }
    .prompt-box { margin: 24px 0 30px; padding: 0 16px; border: 1px solid var(--line); border-radius: 12px; background: #ffffff80; }
    .prompt-box summary { display: flex; align-items: center; gap: 10px; padding: 14px 0; cursor: pointer; list-style: none; }
    summary::-webkit-details-marker { display: none; }
    .prompt-icon { color: var(--accent); display: flex; }
    .prompt-label { font-size: 12px; font-weight: 600; }
    .prompt-hint { color: var(--muted); font-size: 12px; }
    .prompt-chevron { margin-left: auto; transition: transform 180ms; }
    .prompt-box[open] .prompt-chevron { transform: rotate(180deg); }
    .prompt-text { margin: 0; padding: 0 0 16px 28px; color: var(--text-secondary); font-size: 13px; line-height: 1.7; }

    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; align-items: start; }
    .card { min-width: 0; overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: 0 3px 5px #282d2003, 0 8px 24px #282d2004; transition: border-color 180ms, box-shadow 180ms; scroll-margin-top: 24px; }
    .card:hover, .card:focus-within { border-color: #bdc5b1; box-shadow: 0 8px 28px #282d2010; }
    .card:target { border-color: var(--accent); }
    .card-head { display: flex; align-items: center; gap: 12px; padding: 18px 20px; }
    .card-identity { min-width: 0; }
    .card-title { margin: 0; font-size: 16px; font-weight: 650; line-height: 1.35; letter-spacing: -.025em; overflow-wrap: anywhere; }
    .preview { padding: 0 8px; }
    .preview-frame { position: relative; width: 100%; aspect-ratio: 4 / 5; overflow: hidden; border: 1px solid #00000008; border-radius: 13px; background: #f0f0ec; }
    iframe { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
    .preview-frame iframe { position: absolute; inset: 0; width: 800px; height: 1000px; transform: scale(var(--preview-scale, 1)); transform-origin: top left; }
    .card-footer { padding: 18px 20px 20px; }
    .stats-panel { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin: 0 0 18px; }
    .stat-card { min-width: 0; padding: 0 14px; border-left: 1px solid var(--line); }
    .stat-card:first-child { padding-left: 0; border-left: 0; }
    .stat-label { display: block; margin: 0 0 6px; color: var(--muted); font-size: 10px; line-height: 1.3; }
    .stat-value { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.2; font-variant-numeric: tabular-nums; }
    .stat-unit { margin-left: 3px; color: var(--muted); font-size: 11px; font-weight: 400; }
    .card-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .card-button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; color: var(--text-secondary); background: var(--surface); font-size: 12px; font-weight: 550; text-decoration: none; transition: background 160ms, border-color 160ms, box-shadow 160ms; }
    .card-button:hover { color: var(--text); background: #f5f6f1; border-color: #b8bfac; }
    .card-button:active { transform: translateY(1px); }
    .card-button.is-primary { color: #fff; background: #30392a; border-color: #30392a; }
    .card-button.is-primary:hover { background: #47543d; border-color: #47543d; box-shadow: 0 3px 8px #30392a25; }
    .card-details { margin-top: 14px; }
    .card-details summary { display: flex; align-items: center; justify-content: center; gap: 5px; width: fit-content; min-height: 28px; margin: auto; color: var(--muted); font-size: 11px; list-style: none; cursor: pointer; }
    .card-details summary:hover { color: var(--accent); }
    .card-details[open] summary svg { transform: rotate(180deg); }
    .detail-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 12px 0 0; padding: 12px 0 0; border-top: 1px solid var(--line); }
    .detail-stats div { text-align: center; }
    .detail-stats dt { color: var(--muted); font-size: 10px; }
    .detail-stats dd { margin: 6px 0 0; font-size: 13px; font-variant-numeric: tabular-nums; }

    .model-directory { position: fixed; top: 36px; bottom: 36px; left: max(24px, calc((100vw - 1440px) / 2 + 24px)); z-index: 30; display: grid; grid-template-rows: auto minmax(0, 1fr); width: 200px; padding: 18px 10px 12px; border: 1px solid var(--line); border-radius: 16px; background: #fafbf7; }
    .directory-heading { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 0 8px 18px; }
    .directory-title { margin: 0; font-size: 12px; font-weight: 650; }
    .directory-count { color: var(--muted); font-size: 10px; }
    .directory-list { display: flex; flex-direction: column; gap: 3px; min-height: 0; margin: 0; padding: 0; overflow-y: auto; list-style: none; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
    .directory-link { display: block; padding: 10px; border-radius: 8px; color: var(--text-secondary); font-size: 11px; line-height: 1.4; text-decoration: none; transition: background 150ms, color 150ms; }
    .directory-link:hover { color: var(--text); background: #eef0e8; }
    .directory-link.is-active { color: #445038; font-weight: 600; background: #e7ecde; }
    .directory-toggle, .directory-close { display: none; align-items: center; justify-content: center; width: 44px; height: 44px; border: 1px solid var(--line); border-radius: 10px; color: var(--text); background: var(--surface); }
    .directory-toggle { position: fixed; left: 20px; bottom: 20px; z-index: 31; box-shadow: 0 4px 20px #26292320; }
    .directory-backdrop { position: fixed; inset: 0; z-index: 29; background: #1a201a50; opacity: 0; pointer-events: none; transition: opacity 180ms; }
    .preview-dialog { width: min(1100px, calc(100vw - 48px)); height: min(900px, calc(100dvh - 48px)); max-width: none; max-height: none; padding: 0; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); color: var(--text); box-shadow: 0 30px 100px #0003; }
    .preview-dialog::backdrop { background: #171d19a6; backdrop-filter: blur(5px); }
    .dialog-head { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
    .dialog-title { margin: 0 auto 0 0; font-size: 15px; }
    .dialog-close { flex-shrink: 0; width: 42px; padding: 0; }
    .dialog-frame { height: calc(100% - 67px); }
    body.preview-open { overflow: hidden; }

    @media (min-width: 1440px) { .page { max-width: 1660px; padding-left: 256px; } .model-directory { left: max(24px, calc((100vw - 1660px) / 2 + 24px)); } }
    @media (max-width: 1100px) {
      .page { padding: 32px 24px 64px; }
      .directory-toggle { display: inline-flex; }
      .directory-close { display: inline-flex; width: 32px; height: 32px; border: 0; background: transparent; }
      .model-directory { top: 0; bottom: 0; left: 0; width: min(82vw, 300px); padding: 24px 14px; border-radius: 0 18px 18px 0; transform: translateX(-102%); visibility: hidden; transition: transform 200ms, visibility 200ms; }
      body.directory-open .model-directory { transform: translateX(0); visibility: visible; }
      body.directory-open .directory-backdrop { opacity: 1; pointer-events: auto; }
      body.directory-open { overflow: hidden; }
      body.directory-open .directory-toggle { visibility: hidden; }
    }
    @media (max-width: 720px) {
      .page { padding: 28px 16px 84px; }
      .grid { grid-template-columns: 1fr; gap: 20px; }
      .timebar { align-items: flex-start; gap: 16px; }
      .hero h1 { font-size: 28px; }
      .hero-description { max-width: 210px; font-size: 12px; }
      .time-meta { padding-top: 3px; }
      .time-value { font-size: 22px; }
      .timezone { max-width: 125px; text-align: right; font-size: 9px; line-height: 1.5; overflow-wrap: anywhere; }
      .repo-link { padding: 7px 9px; font-size: 10px; }
      .prompt-box { margin: 20px 0 24px; padding: 0 12px; }
      .prompt-hint { font-size: 10px; }
      .prompt-text { padding-left: 0; font-size: 12px; }
      .card-head { padding: 16px; gap: 10px; }
      .card-title { font-size: 15px; }
      .card-footer { padding: 16px; }
      .card-button { min-height: 44px; }
      .preview-dialog { width: calc(100vw - 16px); height: calc(100dvh - 24px); border-radius: 14px; }
      .dialog-head { padding: 10px; gap: 8px; }
      .dialog-title { font-size: 13px; }
      .dialog-head .card-button { font-size: 11px; }
      .dialog-frame { height: calc(100% - 65px); }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>

    const grid = document.getElementById("grid")
    const timeValue = document.getElementById("timeValue")
    const timezoneValue = document.getElementById("timezoneValue")

    function updateTime() {
      const now = new Date()
      const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone || "Unknown"
      const timeText = new Intl.DateTimeFormat("zh-CN", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      }).format(now)

      timeValue.textContent = timeText
      timezoneValue.textContent = timezone
    }
    updateTime()
    window.setInterval(updateTime, 1000)

    function formatBytes(bytes) {
      if (!Number.isFinite(bytes)) return "-"
      if (bytes < 1024) return `${bytes} B`
      return `${(bytes / 1024).toFixed(1)} KB`
    }

      const card = document.createElement("article")
      card.className = "card"

      const stats = model.stats || {}

      card.innerHTML = `
        <div class="card-head">
          <div class="card-identity">
            <h3 class="card-title">${model.name}</h3>
          </div>
        </div>
        <div class="preview">
          <div class="preview-frame">
            <iframe src="${model.path}" title="${model.name} mechanical clock preview" loading="lazy" referrerpolicy="no-referrer"></iframe>
          </div>
        </div>
        <div class="card-footer">
          <dl class="stats-panel" aria-label="${model.name} 代码统计">
            <div class="stat-card"><dt class="stat-label">代码总行数</dt><dd class="stat-value">${stats.lines ?? "-"}<span class="stat-unit">行</span></dd></div>
            <div class="stat-card"><dt class="stat-label">函数数量</dt><dd class="stat-value">${stats.functions ?? "-"}<span class="stat-unit">个</span></dd></div>
            <div class="stat-card"><dt class="stat-label">文件大小</dt><dd class="stat-value">${formatBytes(stats.bytes)}</dd></div>
          </dl>
          <div class="card-actions">
            <button class="card-button" type="button" data-preview="${index}" aria-label="放大预览 ${model.name}" aria-haspopup="dialog">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg>
              放大预览
            </button>
            <a class="card-button is-primary" href="${model.path}" target="_blank" rel="noreferrer" aria-label="独立打开 ${model.name}（新标签页）">
              独立打开
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"/></svg>
            </a>
          </div>
          <details class="card-details">
            <summary>代码详情 <svg viewBox="0 0 20 20" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m5 7.5 5 5 5-5"/></svg></summary>
            <dl class="detail-stats">
              <div><dt>有效代码</dt><dd>${stats.codeLines ?? "-"} 行</dd></div>
              <div><dt>注释</dt><dd>${stats.commentLines ?? "-"} 行</dd></div>
              <div><dt>空行</dt><dd>${stats.blankLines ?? "-"} 行</dd></div>
            </dl>
          </details>
        </div>
      `
      grid.appendChild(card)
    })

    // Give every clock the same canvas viewport, then scale it to fit its card.
    const previewObserver = new ResizeObserver((entries) => {
      entries.forEach(({ target, contentRect }) => {
        target.style.setProperty("--preview-scale", contentRect.width / 800)
      })
    })
    document.querySelectorAll(".preview-frame").forEach((frame) => previewObserver.observe(frame))

    const previewDialog = document.getElementById("previewDialog")
    const dialogFrame = document.getElementById("dialogFrame")
    let previewTrigger = null

    grid.addEventListener("click", (event) => {
      const trigger = event.target.closest("[data-preview]")
      if (!trigger) return
      const model = models[Number(trigger.dataset.preview)]
      previewTrigger = trigger
      document.getElementById("dialogTitle").textContent = model.name
      document.getElementById("dialogLink").href = model.path
      const frame = document.createElement("iframe")
      frame.src = model.path
      frame.title = `${model.name} 放大预览`
      frame.referrerPolicy = "no-referrer"
      dialogFrame.replaceChildren(frame)
      previewDialog.showModal()
      document.body.classList.add("preview-open")
    })
    document.getElementById("dialogClose").addEventListener("click", () => previewDialog.close())
    previewDialog.addEventListener("click", (event) => {
      const rect = previewDialog.getBoundingClientRect()
      if (event.target === previewDialog && (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom)) previewDialog.close()
    })
    previewDialog.addEventListener("close", () => {
      dialogFrame.replaceChildren()
      document.body.classList.remove("preview-open")
      previewTrigger?.focus({ preventScroll: true })
    })

    const directoryList = document.getElementById("modelDirectoryList")
    const directoryCount = document.getElementById("directoryCount")
    const directoryToggle = document.getElementById("directoryToggle")
    const directoryClose = document.getElementById("directoryClose")
    const directoryBackdrop = document.getElementById("directoryBackdrop")

    directoryCount.textContent = `${models.length} 个模型`
    models.forEach((model, index) => {
      const item = document.createElement("li")
      const link = document.createElement("a")
      link.className = "directory-link"
      link.href = `#model-${index}`
      link.textContent = model.name
      link.dataset.target = `model-${index}`
      item.appendChild(link)
      directoryList.appendChild(item)
    })

    function setDirectoryOpen(isOpen) {
      document.body.classList.toggle("directory-open", isOpen)
      directoryToggle.setAttribute("aria-expanded", String(isOpen))
    }

    directoryToggle.addEventListener("click", () => setDirectoryOpen(true))
    directoryClose.addEventListener("click", () => setDirectoryOpen(false))
    directoryBackdrop.addEventListener("click", () => setDirectoryOpen(false))
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") setDirectoryOpen(false)
    })
    directoryList.addEventListener("click", (event) => {
      const link = event.target.closest(".directory-link")
      if (!link) return
      setDirectoryOpen(false)
      directoryList.querySelectorAll(".directory-link").forEach((item) => item.classList.remove("is-active"))
      link.classList.add("is-active")
    })

    const directoryLinks = [...directoryList.querySelectorAll(".directory-link")]
    const cardObserver = new IntersectionObserver((entries) => {
      const visible = entries
        .filter((entry) => entry.isIntersecting)
        .sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0]
      if (!visible) return
      directoryLinks.forEach((link) => link.classList.toggle("is-active", link.dataset.target === visible.target.id))
    }, { rootMargin: "-18% 0px -62% 0px", threshold: [0, 0.25, 0.6, 1] })

    document.querySelectorAll(".card").forEach((card) => cardObserver.observe(card))
    directoryLinks[0]?.classList.add("is-active")
  </script>
</body>

</html>
