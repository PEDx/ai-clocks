<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Canvas 机械时钟</title>
  <style>
    :root {
      --bg-1: #0f1116;
      --bg-2: #1b1f27;
      --metal: #b98a4a;
      --steel: #a3b2c4;
      --shadow: rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at top, rgba(255, 255, 255, 0.06), transparent 35%),
        linear-gradient(180deg, var(--bg-2), var(--bg-1));
      font-family: "Times New Roman", serif;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    .hint {
      position: fixed;
      left: 16px;
      bottom: 16px;
      color: rgba(255, 255, 255, 0.72);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="clock"></canvas>
  <div class="hint">Canvas Mechanical Clock</div>

  <script>
    const canvas = document.getElementById("clock");
    const ctx = canvas.getContext("2d");
    const TAU = Math.PI * 2;
    const DPR = Math.max(1, Math.min(window.devicePixelRatio || 1, 2));

    function resize() {
      canvas.width = Math.floor(window.innerWidth * DPR);
      canvas.height = Math.floor(window.innerHeight * DPR);
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }

    function polar(radius, angle) {
      return {
        x: Math.cos(angle) * radius,
        y: Math.sin(angle) * radius,
      };
    }

    function drawGear(x, y, radius, teeth, rotation, colors) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rotation);

      const innerRadius = radius * 0.78;
      const toothDepth = radius * 0.12;

      ctx.beginPath();
      for (let i = 0; i < teeth * 2; i++) {
        const angle = (i / (teeth * 2)) * TAU;
        const r = i % 2 === 0 ? radius + toothDepth : radius;
        const p = polar(r, angle);
        if (i === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      }
      ctx.closePath();

      const gearGrad = ctx.createRadialGradient(
        -radius * 0.25,
        -radius * 0.25,
        radius * 0.1,
        0,
        0,
        radius + toothDepth
      );
      gearGrad.addColorStop(0, colors.light);
      gearGrad.addColorStop(0.45, colors.mid);
      gearGrad.addColorStop(1, colors.dark);

      ctx.fillStyle = gearGrad;
      ctx.shadowColor = "rgba(0,0,0,0.35)";
      ctx.shadowBlur = radius * 0.18;
      ctx.fill();

      ctx.shadowBlur = 0;
      ctx.lineWidth = Math.max(1.5, radius * 0.08);
      ctx.strokeStyle = "rgba(28, 20, 10, 0.55)";
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(0, 0, innerRadius, 0, TAU);
      ctx.fillStyle = "rgba(25, 18, 10, 0.18)";
      ctx.fill();
      ctx.lineWidth = Math.max(1, radius * 0.05);
      ctx.strokeStyle = "rgba(255,255,255,0.18)";
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(0, 0, radius * 0.28, 0, TAU);
      ctx.fillStyle = colors.core;
      ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,0.2)";
      ctx.stroke();

      for (let i = 0; i < 6; i++) {
        ctx.save();
        ctx.rotate((i / 6) * TAU + rotation * 0.15);
        ctx.fillStyle = "rgba(40, 28, 16, 0.45)";
        ctx.fillRect(radius * 0.1, -radius * 0.04, radius * 0.5, radius * 0.08);
        ctx.restore();
      }

      ctx.restore();
    }

    function drawRivet(x, y, r) {
      const grad = ctx.createRadialGradient(x - r * 0.4, y - r * 0.4, r * 0.1, x, y, r);
      grad.addColorStop(0, "#f7ead1");
      grad.addColorStop(0.5, "#b98a4a");
      grad.addColorStop(1, "#5d4322");
      ctx.beginPath();
      ctx.arc(x, y, r, 0, TAU);
      ctx.fillStyle = grad;
      ctx.fill();
    }

    function drawDial(cx, cy, radius, now) {
      ctx.save();
      ctx.translate(cx, cy);

      const bezel = ctx.createRadialGradient(
        -radius * 0.2,
        -radius * 0.2,
        radius * 0.1,
        0,
        0,
        radius * 1.06
      );
      bezel.addColorStop(0, "#f6d38c");
      bezel.addColorStop(0.4, "#ba8746");
      bezel.addColorStop(1, "#5e4120");

      ctx.beginPath();
      ctx.arc(0, 0, radius * 1.05, 0, TAU);
      ctx.fillStyle = bezel;
      ctx.shadowColor = "rgba(0,0,0,0.45)";
      ctx.shadowBlur = radius * 0.12;
      ctx.fill();

      const face = ctx.createRadialGradient(0, -radius * 0.25, radius * 0.08, 0, 0, radius);
      face.addColorStop(0, "#f8f1da");
      face.addColorStop(0.6, "#e4d5b1");
      face.addColorStop(1, "#bda57b");

      ctx.beginPath();
      ctx.arc(0, 0, radius * 0.94, 0, TAU);
      ctx.fillStyle = face;
      ctx.fill();

      ctx.lineWidth = Math.max(2, radius * 0.03);
      ctx.strokeStyle = "rgba(84, 57, 28, 0.65)";
      ctx.stroke();

      for (let i = 0; i < 60; i++) {
        const angle = -Math.PI / 2 + (i / 60) * TAU;
        const outer = polar(radius * 0.86, angle);
        const inner = polar(i % 5 === 0 ? radius * 0.72 : radius * 0.78, angle);
        ctx.beginPath();
        ctx.moveTo(inner.x, inner.y);
        ctx.lineTo(outer.x, outer.y);
        ctx.lineWidth = i % 5 === 0 ? Math.max(2, radius * 0.015) : Math.max(1, radius * 0.006);
        ctx.strokeStyle = i % 5 === 0 ? "rgba(70, 44, 18, 0.85)" : "rgba(70, 44, 18, 0.45)";
        ctx.stroke();
      }

      ctx.fillStyle = "rgba(68, 43, 20, 0.9)";
      ctx.font = `${Math.round(radius * 0.17)}px Georgia, serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      const numerals = ["XII", "I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI"];
      for (let i = 0; i < 12; i++) {
        const angle = -Math.PI / 2 + (i / 12) * TAU;
        const pos = polar(radius * 0.6, angle);
        ctx.fillText(numerals[i], pos.x, pos.y);
      }

      ctx.font = `${Math.round(radius * 0.06)}px Georgia, serif`;
      ctx.fillStyle = "rgba(70, 44, 18, 0.7)";
      ctx.fillText("MECHANICA", 0, radius * 0.28);

      const ms = now.getMilliseconds();
      const second = now.getSeconds() + ms / 1000;
      const minute = now.getMinutes() + second / 60;
      const hour = (now.getHours() % 12) + minute / 60;

      const hourAngle = -Math.PI / 2 + (hour / 12) * TAU;
      const minuteAngle = -Math.PI / 2 + (minute / 60) * TAU;
      const secondAngle = -Math.PI / 2 + (second / 60) * TAU;

      function drawHand(angle, length, width, color, tail, tipWidth) {
        ctx.save();
        ctx.rotate(angle);
        ctx.beginPath();
        ctx.moveTo(-tail, 0);
        ctx.lineTo(length * 0.16, -width * 0.6);
        ctx.lineTo(length, 0);
        ctx.lineTo(length * 0.16, width * 0.6);
        ctx.closePath();
        const grad = ctx.createLinearGradient(-tail, 0, length, 0);
        grad.addColorStop(0, color[0]);
        grad.addColorStop(1, color[1]);
        ctx.fillStyle = grad;
        ctx.shadowColor = "rgba(0,0,0,0.3)";
        ctx.shadowBlur = width * 0.8;
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.lineWidth = tipWidth;
        ctx.strokeStyle = "rgba(255,255,255,0.18)";
        ctx.stroke();
        ctx.restore();
      }

      drawHand(hourAngle, radius * 0.42, radius * 0.065, ["#57412c", "#d8b16c"], radius * 0.08, 1.5);
      drawHand(minuteAngle, radius * 0.62, radius * 0.045, ["#4d5968", "#d6dde5"], radius * 0.1, 1.2);

      ctx.save();
      ctx.rotate(secondAngle);
      ctx.strokeStyle = "#9c2f24";
      ctx.lineWidth = Math.max(2, radius * 0.012);
      ctx.beginPath();
      ctx.moveTo(-radius * 0.18, 0);
      ctx.lineTo(radius * 0.72, 0);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(radius * 0.55, 0, radius * 0.05, 0, TAU);
      ctx.stroke();
      ctx.restore();

      ctx.beginPath();
      ctx.arc(0, 0, radius * 0.08, 0, TAU);
      const cap = ctx.createRadialGradient(-radius * 0.03, -radius * 0.03, radius * 0.01, 0, 0, radius * 0.08);
      cap.addColorStop(0, "#fff1cb");
      cap.addColorStop(0.5, "#bc8d4d");
      cap.addColorStop(1, "#634423");
      ctx.fillStyle = cap;
      ctx.fill();

      ctx.restore();
    }

    function drawPendulum(cx, cy, radius, t) {
      const pivotY = cy + radius * 0.92;
      const swing = Math.sin(t * 1.7) * 0.38;
      const rodLength = radius * 0.9;
      const bobRadius = radius * 0.16;

      ctx.save();
      ctx.translate(cx, pivotY);
      ctx.rotate(swing);

      ctx.strokeStyle = "rgba(215, 190, 140, 0.9)";
      ctx.lineWidth = Math.max(3, radius * 0.015);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, rodLength);
      ctx.stroke();

      const bobGrad = ctx.createRadialGradient(
        -bobRadius * 0.3,
        rodLength - bobRadius * 0.3,
        bobRadius * 0.15,
        0,
        rodLength,
        bobRadius
      );
      bobGrad.addColorStop(0, "#ffebbb");
      bobGrad.addColorStop(0.5, "#c7954d");
      bobGrad.addColorStop(1, "#5a3b1d");

      ctx.beginPath();
      ctx.arc(0, rodLength, bobRadius, 0, TAU);
      ctx.fillStyle = bobGrad;
      ctx.shadowColor = "rgba(0,0,0,0.35)";
      ctx.shadowBlur = bobRadius * 0.5;
      ctx.fill();
      ctx.restore();
    }

    function drawFrame(width, height, cx, cy, radius) {
      const outerW = radius * 2.8;
      const outerH = radius * 3.5;
      const x = cx - outerW / 2;
      const y = cy - radius * 1.2;
      const r = radius * 0.12;

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + outerW, y, x + outerW, y + outerH, r);
      ctx.arcTo(x + outerW, y + outerH, x, y + outerH, r);
      ctx.arcTo(x, y + outerH, x, y, r);
      ctx.arcTo(x, y, x + outerW, y, r);
      ctx.closePath();

      const wood = ctx.createLinearGradient(x, y, x + outerW, y + outerH);
      wood.addColorStop(0, "#4b311d");
      wood.addColorStop(0.3, "#7a5230");
      wood.addColorStop(0.6, "#5d3d24");
      wood.addColorStop(1, "#2d1a10");
      ctx.fillStyle = wood;
      ctx.shadowColor = "rgba(0,0,0,0.45)";
      ctx.shadowBlur = radius * 0.18;
      ctx.fill();

      ctx.lineWidth = Math.max(4, radius * 0.03);
      ctx.strokeStyle = "rgba(245, 220, 175, 0.18)";
      ctx.stroke();

      ctx.fillStyle = "rgba(255,255,255,0.05)";
      ctx.fillRect(x + outerW * 0.06, y + outerH * 0.04, outerW * 0.16, outerH * 0.92);

      drawRivet(x + outerW * 0.1, y + outerH * 0.09, radius * 0.04);
      drawRivet(x + outerW * 0.9, y + outerH * 0.09, radius * 0.04);
      drawRivet(x + outerW * 0.1, y + outerH * 0.91, radius * 0.04);
      drawRivet(x + outerW * 0.9, y + outerH * 0.91, radius * 0.04);

      ctx.restore();
    }

    function render(time) {
      const width = canvas.width / DPR;
      const height = canvas.height / DPR;
      const cx = width / 2;
      const cy = height * 0.42;
      const radius = Math.min(width, height) * 0.2;
      const t = time / 1000;
      const now = new Date();

      ctx.clearRect(0, 0, width, height);

      const vignette = ctx.createRadialGradient(cx, cy, radius * 0.2, cx, cy, Math.max(width, height) * 0.65);
      vignette.addColorStop(0, "rgba(255,255,255,0.04)");
      vignette.addColorStop(1, "rgba(0,0,0,0.3)");
      ctx.fillStyle = vignette;
      ctx.fillRect(0, 0, width, height);

      drawFrame(width, height, cx, cy, radius);

      drawGear(cx - radius * 1.15, cy + radius * 1.18, radius * 0.3, 18, -t * 0.7, {
        light: "#efd39c",
        mid: "#b88745",
        dark: "#5d3d1f",
        core: "#7c5429",
      });
      drawGear(cx - radius * 0.52, cy + radius * 1.44, radius * 0.2, 14, t * 1.05, {
        light: "#dfe6ef",
        mid: "#8c98a8",
        dark: "#495463",
        core: "#677382",
      });
      drawGear(cx + radius * 0.62, cy + radius * 1.36, radius * 0.25, 16, -t * 0.85, {
        light: "#efd39c",
        mid: "#b88745",
        dark: "#5d3d1f",
        core: "#7c5429",
      });
      drawGear(cx + radius * 1.12, cy + radius * 1.1, radius * 0.15, 12, t * 1.4, {
        light: "#dfe6ef",
        mid: "#8c98a8",
        dark: "#495463",
        core: "#677382",
      });

      drawDial(cx, cy, radius, now);
      drawPendulum(cx, cy, radius, t);

      requestAnimationFrame(render);
    }

    window.addEventListener("resize", resize);
    resize();
    requestAnimationFrame(render);
  </script>
</body>
</html>
