<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mechanical Clock</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: radial-gradient(circle at 50% 40%, #3a3a3a 0%, #1a1a1a 60%, #0a0a0a 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Georgia, 'Times New Roman', serif;
  }
  canvas {
    filter: drop-shadow(0 20px 40px rgba(0,0,0,0.6));
  }
</style>
</head>
<body>
<canvas id="clock" width="600" height="600"></canvas>

<script>
const canvas = document.getElementById('clock');
const ctx = canvas.getContext('2d');
const size = canvas.width;
const radius = size / 2;

ctx.translate(radius, radius);
const R = radius * 0.90; // working radius after translation

function drawClock() {
  ctx.clearRect(-radius, -radius, size, size);
  drawOuterRing();
  drawFace();
  drawGears();
  drawTicks();
  drawNumerals();
  drawBrand();
  drawHands();
  drawCenter();
}

function drawOuterRing() {
  // Brass/metal bezel
  const grad = ctx.createRadialGradient(0, 0, R * 0.94, 0, 0, R * 1.08);
  grad.addColorStop(0, '#8a6d3b');
  grad.addColorStop(0.4, '#d4af6a');
  grad.addColorStop(0.55, '#5c4423');
  grad.addColorStop(0.7, '#e8c988');
  grad.addColorStop(1, '#3b2b16');
  ctx.beginPath();
  ctx.arc(0, 0, R * 1.08, 0, Math.PI * 2);
  ctx.fillStyle = grad;
  ctx.fill();

  // Inner bevel shadow
  ctx.beginPath();
  ctx.arc(0, 0, R * 0.98, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(0,0,0,0.5)';
  ctx.lineWidth = 4;
  ctx.stroke();

  // Screws around bezel
  for (let i = 0; i < 12; i++) {
    const a = (i * Math.PI * 2) / 12;
    const x = Math.cos(a) * R * 1.02;
    const y = Math.sin(a) * R * 1.02;
    drawScrew(x, y, 5);
  }
}

function drawScrew(x, y, r) {
  ctx.save();
  ctx.translate(x, y);
  const g = ctx.createRadialGradient(-1, -1, 0, 0, 0, r);
  g.addColorStop(0, '#f0e4c0');
  g.addColorStop(1, '#4a3a1a');
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fillStyle = g;
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.6)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(-r * 0.6, r * 0.2);
  ctx.lineTo(r * 0.6, -r * 0.2);
  ctx.stroke();
  ctx.restore();
}

function drawFace() {
  const grad = ctx.createRadialGradient(-R*0.2, -R*0.3, R*0.1, 0, 0, R*0.95);
  grad.addColorStop(0, '#f7f0dc');
  grad.addColorStop(0.7, '#efe4c5');
  grad.addColorStop(1, '#d8c99a');
  ctx.beginPath();
  ctx.arc(0, 0, R * 0.94, 0, Math.PI * 2);
  ctx.fillStyle = grad;
  ctx.fill();

  ctx.beginPath();
  ctx.arc(0, 0, R * 0.94, 0, Math.PI * 2);
  ctx.strokeStyle = '#8a6d3b';
  ctx.lineWidth = 2;
  ctx.stroke();
}

// Decorative visible "gears" peeking near the center, mechanical-watch style
function drawGears() {
  drawGear(-R * 0.30, R * 0.30, R * 0.14, 8, '#b9a86a');
  drawGear(R * 0.32, R * 0.22, R * 0.10, 10, '#c9b877');
  drawGear(-R * 0.05, -R * 0.35, R * 0.09, 8, '#a9986a');
}

function drawGear(cx, cy, r, teeth, color) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.globalAlpha = 0.35;
  ctx.fillStyle = color;
  ctx.beginPath();
  const toothH = r * 0.28;
  for (let i = 0; i < teeth; i++) {
    const a0 = (i / teeth) * Math.PI * 2;
    const a1 = ((i + 0.5) / teeth) * Math.PI * 2;
    const a2 = ((i + 1) / teeth) * Math.PI * 2;
    ctx.lineTo(Math.cos(a0) * r, Math.sin(a0) * r);
    ctx.lineTo(Math.cos(a1) * (r + toothH), Math.sin(a1) * (r + toothH));
    ctx.lineTo(Math.cos(a2) * r, Math.sin(a2) * r);
  }
  ctx.closePath();
  ctx.fill();
  // hub
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.3, 0, Math.PI * 2);
  ctx.fillStyle = '#5c4423';
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawTicks() {
  for (let i = 0; i < 60; i++) {
    const a = (i * Math.PI * 2) / 60;
    const isHour = i % 5 === 0;
    const outer = R * 0.90;
    const inner = isHour ? R * 0.80 : R * 0.86;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * outer, Math.sin(a) * outer);
    ctx.lineTo(Math.cos(a) * inner, Math.sin(a) * inner);
    ctx.strokeStyle = isHour ? '#2b2417' : '#7a6a45';
    ctx.lineWidth = isHour ? 3 : 1;
    ctx.stroke();
  }
}

function drawNumerals() {
  const romans = ['XII','I','II','III','IV','V','VI','VII','VIII','IX','X','XI'];
  ctx.fillStyle = '#2b2417';
  ctx.font = `${R * 0.13}px Georgia, serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (let i = 0; i < 12; i++) {
    const a = (i * Math.PI * 2) / 12 - Math.PI / 2;
    const x = Math.cos(a) * R * 0.70;
    const y = Math.sin(a) * R * 0.70;
    ctx.fillText(romans[i], x, y);
  }
}

function drawBrand() {
  ctx.fillStyle = '#5c4423';
  ctx.font = `italic ${R * 0.06}px Georgia, serif`;
  ctx.textAlign = 'center';
  ctx.fillText('Claude Clockworks', 0, -R * 0.32);
  ctx.font = `${R * 0.04}px Georgia, serif`;
  ctx.fillText('MECHANICAL', 0, R * 0.45);
}

function drawHands() {
  const now = new Date();
  const ms = now.getMilliseconds();
  const s = now.getSeconds() + ms / 1000;
  const m = now.getMinutes() + s / 60;
  const h = (now.getHours() % 12) + m / 60;

  drawHand((h / 12) * Math.PI * 2, R * 0.5, 7, '#2b2417');
  drawHand((m / 60) * Math.PI * 2, R * 0.72, 5, '#2b2417');
  drawHand((s / 60) * Math.PI * 2, R * 0.80, 2, '#a12b2b', R * 0.15);
}

function drawHand(angle, length, width, color, tailLength) {
  const a = angle - Math.PI / 2;
  ctx.save();
  ctx.lineCap = 'round';
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.beginPath();
  ctx.moveTo(-Math.cos(a) * (tailLength || length * 0.15), -Math.sin(a) * (tailLength || length * 0.15));
  ctx.lineTo(Math.cos(a) * length, Math.sin(a) * length);
  ctx.stroke();
  ctx.restore();
}

function drawCenter() {
  ctx.beginPath();
  ctx.arc(0, 0, 9, 0, Math.PI * 2);
  ctx.fillStyle = '#a12b2b';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(0, 0, 4, 0, Math.PI * 2);
  ctx.fillStyle = '#2b2417';
  ctx.fill();
}

function tick() {
  drawClock();
  requestAnimationFrame(tick);
}

tick();
</script>
</body>
</html>
