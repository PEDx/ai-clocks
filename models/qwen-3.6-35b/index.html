<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>机械时钟</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  display: flex; justify-content: center; align-items: center;
  min-height: 100vh;
  background: linear-gradient(145deg, #1a1a2e, #16213e, #0f3460);
  font-family: 'Georgia', serif;
}
canvas { display: block; }
</style>
</head>
<body>
<canvas id="clock"></canvas>
<script>
const canvas = document.getElementById('clock');
const ctx = canvas.getContext('2d');

const size = Math.min(window.innerWidth, window.innerHeight) * 0.9;
canvas.width = size;
canvas.height = size;

const cx = size / 2, cy = size / 2;
const R = size * 0.42; // outer radius

function draw() {
  const now = new Date();
  const h = now.getHours() % 12;
  const m = now.getMinutes();
  const s = now.getSeconds();
  const ms = now.getMilliseconds();

  const smoothS = s + ms / 1000;
  const smoothM = m + smoothS / 60;
  const smoothH = h + smoothM / 60;

  ctx.clearRect(0, 0, size, size);

  // --- shadow ---
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.5)';
  ctx.shadowBlur = 40;
  ctx.shadowOffsetX = 10;
  ctx.shadowOffsetY = 10;
  ctx.beginPath();
  ctx.arc(cx, cy, R + 20, 0, Math.PI * 2);
  ctx.fillStyle = '#2a2a3a';
  ctx.fill();
  ctx.restore();

  // --- outer case ---
  const grad0 = ctx.createRadialGradient(cx - R * 0.3, cy - R * 0.3, R * 0.1, cx, cy, R + 20);
  grad0.addColorStop(0, '#c9b458');
  grad0.addColorStop(0.5, '#a68b3e');
  grad0.addColorStop(1, '#6b5a2e');
  ctx.beginPath();
  ctx.arc(cx, cy, R + 20, 0, Math.PI * 2);
  ctx.fillStyle = grad0;
  ctx.fill();

  // --- bezel ring ---
  const grad1 = ctx.createRadialGradient(cx, cy, R - 5, cx, cy, R + 18);
  grad1.addColorStop(0, '#d4af37');
  grad1.addColorStop(0.3, '#f5e7a3');
  grad1.addColorStop(0.5, '#d4af37');
  grad1.addColorStop(1, '#8b7332');
  ctx.beginPath();
  ctx.arc(cx, cy, R + 18, 0, Math.PI * 2);
  ctx.arc(cx, cy, R - 5, 0, Math.PI * 2, true);
  ctx.fillStyle = grad1;
  ctx.fill();

  // --- clock face ---
  const gradFace = ctx.createRadialGradient(cx, cy, 0, cx, cy, R);
  gradFace.addColorStop(0, '#fffef5');
  gradFace.addColorStop(0.7, '#f5f0e1');
  gradFace.addColorStop(1, '#e8dfc8');
  ctx.beginPath();
  ctx.arc(cx, cy, R - 5, 0, Math.PI * 2);
  ctx.fillStyle = gradFace;
  ctx.fill();

  // subtle texture
  ctx.save();
  ctx.globalAlpha = 0.03;
  for (let i = 0; i < 360; i += 2) {
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, R - 5, i * Math.PI / 180, (i + 1) * Math.PI / 180);
    ctx.fillStyle = i % 10 < 5 ? '#000' : '#fff';
    ctx.fill();
  }
  ctx.restore();

  // --- tick marks & numbers ---
  for (let i = 0; i < 60; i++) {
    const angle = (i * 6 - 90) * Math.PI / 180;
    const isHour = i % 5 === 0;
    const outerR = R - 12;
    const innerR = isHour ? R - 30 : R - 20;
    const x1 = cx + outerR * Math.cos(angle);
    const y1 = cy + outerR * Math.sin(angle);
    const x2 = cx + innerR * Math.cos(angle);
    const y2 = cy + innerR * Math.sin(angle);

    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = isHour ? '#2c2c2c' : '#888';
    ctx.lineWidth = isHour ? 3.5 : 1.2;
    ctx.lineCap = 'round';
    ctx.stroke();

    // numbers
    if (isHour) {
      const num = i / 5 === 0 ? 12 : i / 5;
      const numR = R - 44;
      const nx = cx + numR * Math.cos(angle);
      const ny = cy + numR * Math.sin(angle);
      ctx.fillStyle = '#2c2c2c';
      ctx.font = `bold ${R * 0.13}px Georgia`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(num, nx, ny);
    }
  }

  // --- decorative inner ring ---
  ctx.beginPath();
  ctx.arc(cx, cy, R - 55, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(160,140,80,0.3)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // --- gear decoration at center ---
  drawGear(cx, cy, R * 0.15, 12, 0.7);

  // --- hour hand ---
  drawHand(smoothH * 30 - 90, R * 0.5, 7, '#1a1a1a', 18, true);

  // --- minute hand ---
  drawHand(smoothM * 6 - 90, R * 0.72, 5, '#2c2c2c', 14, true);

  // --- second hand ---
  const secAngle = smoothS * 6 - 90;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(secAngle * Math.PI / 180);
  // tail
  ctx.beginPath();
  ctx.moveTo(-R * 0.18, 0);
  ctx.lineTo(0, 0);
  ctx.strokeStyle = '#c0392b';
  ctx.lineWidth = 2;
  ctx.stroke();
  // hand
  ctx.beginPath();
  ctx.moveTo(0, -1.5);
  ctx.lineTo(R * 0.78, -1);
  ctx.lineTo(R * 0.78, 1);
  ctx.lineTo(0, 1.5);
  ctx.closePath();
  const secGrad = ctx.createLinearGradient(0, 0, R * 0.78, 0);
  secGrad.addColorStop(0, '#e74c3c');
  secGrad.addColorStop(0.5, '#ff6b6b');
  secGrad.addColorStop(1, '#e74c3c');
  ctx.fillStyle = secGrad;
  ctx.fill();
  ctx.restore();

  // --- center pin ---
  ctx.beginPath();
  ctx.arc(cx, cy, 7, 0, Math.PI * 2);
  ctx.fillStyle = '#c0392b';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx, cy, 3, 0, Math.PI * 2);
  ctx.fillStyle = '#e74c3c';
  ctx.fill();

  // --- brand text ---
  ctx.fillStyle = '#666';
  ctx.font = `${R * 0.065}px Georgia`;
  ctx.textAlign = 'center';
  ctx.fillText('MECHANICAL', cx, cy - R * 0.25);
  ctx.font = `italic ${R * 0.06}px Georgia`;
  ctx.fillText('Automatic', cx, cy + R * 0.12);

  requestAnimationFrame(draw);
}

function drawHand(angle, len, width, color, tail, round) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(angle * Math.PI / 180);
  ctx.beginPath();
  ctx.moveTo(-tail, 0);
  ctx.lineTo(0, -width / 2);
  ctx.lineTo(len, 0);
  ctx.lineTo(0, width / 2);
  ctx.closePath();

  const grad = ctx.createLinearGradient(0, 0, len, 0);
  grad.addColorStop(0, color);
  grad.addColorStop(0.6, lighten(color, 40));
  grad.addColorStop(1, color);
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.3)';
  ctx.lineWidth = 0.5;
  ctx.stroke();
  ctx.restore();
}

function drawGear(x, y, r, teeth, holeRatio) {
  ctx.save();
  ctx.translate(x, y);
  ctx.beginPath();
  const step = (Math.PI * 2) / teeth;
  for (let i = 0; i < teeth; i++) {
    const a = i * step;
    const half = step * 0.35;
    ctx.lineTo(r * Math.cos(a), r * Math.sin(a));
    ctx.lineTo(r * Math.cos(a + half * 0.5), r * Math.sin(a + half * 0.5));
    ctx.lineTo(r * holeRatio * Math.cos(a + half), r * holeRatio * Math.sin(a + half));
    ctx.lineTo(r * holeRatio * Math.cos(a + step - half * 0.5), r * holeRatio * Math.sin(a + step - half * 0.5));
    ctx.lineTo(r * Math.cos(a + step - half), r * Math.sin(a + step - half));
    ctx.lineTo(r * Math.cos(a + step), r * Math.sin(a + step));
  }
  ctx.closePath();
  ctx.strokeStyle = 'rgba(160,140,80,0.35)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.restore();
}

function lighten(hex, amt) {
  let r = parseInt(hex.slice(1, 3), 16);
  let g = parseInt(hex.slice(3, 5), 16);
  let b = parseInt(hex.slice(5, 7), 16);
  r = Math.min(255, r + amt);
  g = Math.min(255, g + amt);
  b = Math.min(255, b + amt);
  return `rgb(${r},${g},${b})`;
}

draw();
</script>
</body>
</html>
