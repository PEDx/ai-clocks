<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mechanical Clock</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at center, #2a2a2a 0%, #0d0d0d 100%);
      font-family: 'Georgia', serif;
    }
    canvas {
      display: block;
      filter: drop-shadow(0 20px 60px rgba(0,0,0,0.8));
    }
  </style>
</head>
<body>
  <canvas id="clock"></canvas>
  <script>
    const canvas = document.getElementById('clock');
    const ctx = canvas.getContext('2d');

    const size = Math.min(window.innerWidth * 0.9, window.innerHeight * 0.85, 520);
    canvas.width = size;
    canvas.height = size;

    const cx = size / 2;
    const cy = size / 2;
    const radius = size * 0.44;
    const bezelWidth = size * 0.08;

    const romanNumerals = ['XII', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI'];

    function drawClock() {
      ctx.clearRect(0, 0, size, size);

      // Outer bezel - metallic brass ring
      const bezelGrad = ctx.createRadialGradient(cx - radius * 0.3, cy - radius * 0.3, 0, cx, cy, radius + bezelWidth);
      bezelGrad.addColorStop(0, '#E8C96A');
      bezelGrad.addColorStop(0.3, '#D4A82B');
      bezelGrad.addColorStop(0.6, '#B8860B');
      bezelGrad.addColorStop(0.85, '#8B6914');
      bezelGrad.addColorStop(1, '#5C4A1A');

      ctx.beginPath();
      ctx.arc(cx, cy, radius + bezelWidth, 0, Math.PI * 2);
      ctx.fillStyle = bezelGrad;
      ctx.fill();

      // Bezel edge highlight
      ctx.beginPath();
      ctx.arc(cx, cy, radius + bezelWidth, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255,220,150,0.4)';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Inner bezel shadow
      ctx.beginPath();
      ctx.arc(cx, cy, radius + 2, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(0,0,0,0.4)';
      ctx.lineWidth = 4;
      ctx.stroke();

      // Clock face - ivory
      const faceGrad = ctx.createRadialGradient(cx - radius * 0.25, cy - radius * 0.25, 0, cx, cy, radius);
      faceGrad.addColorStop(0, '#FFFEF5');
      faceGrad.addColorStop(0.5, '#F5F0E0');
      faceGrad.addColorStop(1, '#E8E0CC');

      ctx.beginPath();
      ctx.arc(cx, cy, radius - 2, 0, Math.PI * 2);
      ctx.fillStyle = faceGrad;
      ctx.fill();

      // Inner decorative ring
      ctx.beginPath();
      ctx.arc(cx, cy, radius * 0.88, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(180,140,60,0.3)';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Minute ticks
      for (let i = 0; i < 60; i++) {
        if (i % 5 !== 0) {
          const angle = (i * 6 - 90) * Math.PI / 180;
          const outerR = radius * 0.96;
          const innerR = radius * 0.90;
          ctx.beginPath();
          ctx.moveTo(cx + Math.cos(angle) * innerR, cy + Math.sin(angle) * innerR);
          ctx.lineTo(cx + Math.cos(angle) * outerR, cy + Math.sin(angle) * outerR);
          ctx.strokeStyle = '#666';
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }

      // Hour ticks (major)
      for (let i = 0; i < 12; i++) {
        const angle = (i * 30 - 90) * Math.PI / 180;
        const outerR = radius * 0.96;
        const innerR = radius * 0.83;
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(angle) * innerR, cy + Math.sin(angle) * innerR);
        ctx.lineTo(cx + Math.cos(angle) * outerR, cy + Math.sin(angle) * outerR);
        ctx.strokeStyle = '#222';
        ctx.lineWidth = 3;
        ctx.stroke();
      }

      // Roman numerals
      ctx.font = `bold ${size * 0.075}px Georgia`;
      ctx.fillStyle = '#1a1a1a';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      for (let i = 0; i < 12; i++) {
        const angle = (i * 30 - 90) * Math.PI / 180;
        const numeralR = radius * 0.70;
        const nx = cx + Math.cos(angle) * numeralR;
        const ny = cy + Math.sin(angle) * numeralR;

        // Subtle shadow under numerals
        ctx.fillStyle = 'rgba(0,0,0,0.1)';
        ctx.fillText(romanNumerals[i], nx + 1, ny + 1);
        ctx.fillStyle = '#1a1a1a';
        ctx.fillText(romanNumerals[i], nx, ny);
      }

      // Get current time
      const now = new Date();
      const hours = now.getHours() % 12;
      const minutes = now.getMinutes();
      const seconds = now.getSeconds();
      const milliseconds = now.getMilliseconds();

      // Smooth second hand (continuous sweep)
      const smoothSeconds = seconds + milliseconds / 1000;
      const smoothMinutes = minutes + smoothSeconds / 60;
      const smoothHours = hours + smoothMinutes / 60;

      // Hour hand
      const hourAngle = (smoothHours * 30 - 90) * Math.PI / 180;
      const hourLength = radius * 0.50;
      const hourWidth = size * 0.018;
      drawHand(hourAngle, hourLength, hourWidth, '#1a1a1a', '#333');

      // Minute hand
      const minuteAngle = (smoothMinutes * 6 - 90) * Math.PI / 180;
      const minuteLength = radius * 0.70;
      const minuteWidth = size * 0.012;
      drawHand(minuteAngle, minuteLength, minuteWidth, '#1a1a1a', '#333');

      // Second hand
      const secondAngle = (smoothSeconds * 6 - 90) * Math.PI / 180;
      const secondLength = radius * 0.78;
      const secondWidth = size * 0.006;
      drawSecondHand(secondAngle, secondLength, secondWidth, '#8B0000', '#CC0000');

      // Center cap
      const capGrad = ctx.createRadialGradient(cx - 3, cy - 3, 0, cx, cy, size * 0.035);
      capGrad.addColorStop(0, '#F0D060');
      capGrad.addColorStop(0.5, '#C49A20');
      capGrad.addColorStop(1, '#8B6914');

      ctx.beginPath();
      ctx.arc(cx, cy, size * 0.032, 0, Math.PI * 2);
      ctx.fillStyle = capGrad;
      ctx.fill();
      ctx.strokeStyle = '#5C4A1A';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Inner dot on cap
      ctx.beginPath();
      ctx.arc(cx, cy, size * 0.012, 0, Math.PI * 2);
      ctx.fillStyle = '#3a2a0a';
      ctx.fill();
    }

    function drawHand(angle, length, width, color, shadowColor) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(angle);

      // Shadow
      ctx.shadowColor = 'rgba(0,0,0,0.35)';
      ctx.shadowBlur = 8;
      ctx.shadowOffsetX = 3;
      ctx.shadowOffsetY = 3;

      // Hand body
      const grad = ctx.createLinearGradient(-width / 2, 0, width / 2, 0);
      grad.addColorStop(0, shadowColor);
      grad.addColorStop(0.3, color);
      grad.addColorStop(0.5, '#555');
      grad.addColorStop(0.7, color);
      grad.addColorStop(1, shadowColor);

      ctx.beginPath();
      ctx.roundRect(-width / 2, -length * 0.15, width, length * 1.15, width / 2);
      ctx.fillStyle = grad;
      ctx.fill();

      ctx.restore();
    }

    function drawSecondHand(angle, length, width, color, accentColor) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(angle);

      // Shadow
      ctx.shadowColor = 'rgba(0,0,0,0.3)';
      ctx.shadowBlur = 5;
      ctx.shadowOffsetX = 2;
      ctx.shadowOffsetY = 2;

      // Main shaft
      ctx.beginPath();
      ctx.roundRect(-width / 2, -length * 0.15, width, length * 1.1, width / 2);
      ctx.fillStyle = color;
      ctx.fill();

      // Counterweight
      ctx.beginPath();
      ctx.arc(0, -length * 0.12, width * 2.5, 0, Math.PI * 2);
      ctx.fillStyle = accentColor;
      ctx.fill();

      ctx.restore();
    }

    function animate() {
      drawClock();
      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
