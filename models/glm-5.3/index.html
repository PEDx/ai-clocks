<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GLM 5.3 · Mechanical Clock</title>
  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 35%, #2b2f36 0%, #16181c 70%);
      font-family: -apple-system, "SF Pro Text", "PingFang SC", sans-serif;
    }

    .clock-wrap {
      position: relative;
      width: min(88vmin, 640px);
      aspect-ratio: 1 / 1;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <div class="clock-wrap">
    <canvas id="clock"></canvas>
  </div>

  <script>
    const canvas = document.getElementById("clock")
    const ctx = canvas.getContext("2d")
    const TAU = Math.PI * 2

    // 高分屏适配:按 devicePixelRatio 放大画布,绘制时统一按逻辑尺寸换算
    function resize() {
      const dpr = window.devicePixelRatio || 1
      const rect = canvas.getBoundingClientRect()
      canvas.width = Math.round(rect.width * dpr)
      canvas.height = Math.round(rect.height * dpr)
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
    }
    window.addEventListener("resize", resize)
    resize()

    // 机械秒针:每秒一跳,带轻微回弹,模拟擒纵机构的步进
    function secondAngle(date) {
      const ms = date.getMilliseconds()
      const sec = date.getSeconds()
      const t = Math.min(ms / 180, 1) // 180ms 内完成一步
      const ease = 1 - Math.pow(1 - t, 3) - Math.sin(t * Math.PI) * 0.04
      return ((sec + ease) / 60) * TAU
    }

    function drawBezel(cx, cy, r) {
      // 外圈金属拉丝质感
      const ring = ctx.createLinearGradient(cx - r, cy - r, cx + r, cy + r)
      ring.addColorStop(0, "#6a6f78")
      ring.addColorStop(0.25, "#c9ced6")
      ring.addColorStop(0.5, "#7c828c")
      ring.addColorStop(0.75, "#b8bec7")
      ring.addColorStop(1, "#5d626b")
      ctx.beginPath()
      ctx.arc(cx, cy, r, 0, TAU)
      ctx.fillStyle = ring
      ctx.fill()

      // 内圈阴影,制造表盘凹陷感
      ctx.beginPath()
      ctx.arc(cx, cy, r * 0.9, 0, TAU)
      ctx.fillStyle = "#f6f2ea"
      ctx.fill()
      ctx.lineWidth = r * 0.02
      ctx.strokeStyle = "rgba(0,0,0,0.18)"
      ctx.stroke()
    }

    function drawTicks(cx, cy, r) {
      for (let i = 0; i < 60; i += 1) {
        const angle = (i / 60) * TAU - Math.PI / 2
        const isHour = i % 5 === 0
        const len = isHour ? r * 0.09 : r * 0.035
        const width = isHour ? r * 0.014 : r * 0.005
        const rOuter = r * 0.82
        const rInner = rOuter - len

        ctx.beginPath()
        ctx.moveTo(cx + Math.cos(angle) * rInner, cy + Math.sin(angle) * rInner)
        ctx.lineTo(cx + Math.cos(angle) * rOuter, cy + Math.sin(angle) * rOuter)
        ctx.lineWidth = width
        ctx.lineCap = "round"
        ctx.strokeStyle = isHour ? "#2c2a27" : "#a09a90"
        ctx.stroke()
      }
    }

    function drawNumerals(cx, cy, r) {
      ctx.font = `600 ${Math.round(r * 0.11)}px Georgia, "Times New Roman", serif`
      ctx.textAlign = "center"
      ctx.textBaseline = "middle"
      ctx.fillStyle = "#2c2a27"

      for (let h = 1; h <= 12; h += 1) {
        const angle = (h / 12) * TAU - Math.PI / 2
        const dist = r * 0.66
        ctx.fillText(String(h), cx + Math.cos(angle) * dist, cy + Math.sin(angle) * dist)
      }
    }

    function drawBrand(cx, cy, r) {
      ctx.font = `500 ${Math.round(r * 0.05)}px -apple-system, sans-serif`
      ctx.textAlign = "center"
      ctx.textBaseline = "middle"
      ctx.fillStyle = "#8a847b"
      ctx.fillText("GLM 5.3", cx, cy - r * 0.26)
      ctx.fillText("MECHANICAL", cx, cy + r * 0.3)
    }

    function drawHand(cx, cy, angle, length, width, color, tail) {
      // 以表心为原点,先画尾部配重再画针身
      ctx.save()
      ctx.translate(cx, cy)
      ctx.rotate(angle)
      ctx.beginPath()
      ctx.moveTo(0, tail)
      ctx.lineTo(0, -length)
      ctx.lineWidth = width
      ctx.lineCap = "round"
      ctx.strokeStyle = color
      ctx.stroke()
      // 针尖高光,让针身立体一些
      ctx.beginPath()
      ctx.moveTo(0, tail)
      ctx.lineTo(0, -length)
      ctx.lineWidth = width * 0.4
      ctx.strokeStyle = "rgba(255,255,255,0.25)"
      ctx.stroke()
      ctx.restore()
    }

    function drawHands(cx, cy, r, now) {
      const ms = now.getTime()
      const hours = now.getHours() % 12
      const minutes = now.getMinutes()
      const seconds = now.getSeconds() + ms % 1000 / 1000

      const hourAngle = ((hours + minutes / 60) / 12) * TAU
      const minuteAngle = ((minutes + seconds / 60) / 60) * TAU
      const secAngle = secondAngle(now)

      // 时针 / 分针平滑走,秒针步进走
      drawHand(cx, cy, hourAngle, r * 0.48, r * 0.028, "#33302c", r * 0.1)
      drawHand(cx, cy, minuteAngle, r * 0.72, r * 0.02, "#33302c", r * 0.12)
      drawHand(cx, cy, secAngle, r * 0.78, r * 0.008, "#c05037", r * 0.18)
    }

    function drawCenterCap(cx, cy, r) {
      ctx.beginPath()
      ctx.arc(cx, cy, r * 0.035, 0, TAU)
      ctx.fillStyle = "#c05037"
      ctx.fill()
      ctx.beginPath()
      ctx.arc(cx, cy, r * 0.016, 0, TAU)
      ctx.fillStyle = "#f0ece4"
      ctx.fill()
    }

    function drawGlassReflection(cx, cy, r) {
      // 左上高光弧,模拟表镜反光
      ctx.beginPath()
      ctx.arc(cx, cy, r * 0.86, -Math.PI * 0.85, -Math.PI * 0.5)
      ctx.lineWidth = r * 0.06
      ctx.lineCap = "round"
      ctx.strokeStyle = "rgba(255,255,255,0.14)"
      ctx.stroke()
    }

    function render(now) {
      const rect = canvas.getBoundingClientRect()
      const cx = rect.width / 2
      const cy = rect.height / 2
      const r = Math.min(rect.width, rect.height) / 2 - 4

      ctx.clearRect(0, 0, rect.width, rect.height)
      drawBezel(cx, cy, r)
      drawTicks(cx, cy, r)
      drawNumerals(cx, cy, r)
      drawBrand(cx, cy, r)
      drawHands(cx, cy, r, now)
      drawCenterCap(cx, cy, r)
      drawGlassReflection(cx, cy, r)
    }

    function tick() {
      render(new Date())
      requestAnimationFrame(tick)
    }
    tick()
  </script>
</body>

</html>
